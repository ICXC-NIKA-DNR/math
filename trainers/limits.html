<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limits — evaluate limits from scratch</title>
<style>
:root{
  --bg:#080808; --panel:#111111; --panel-hi:#171717;
  --rule:#242424; --rule2:#1E1E1E; --line:#2A2A2A;
  --tx:#F4F4F4; --dim:#A0A0A0; --dim2:#8A8A8A; --faint:#666666;
  /* violet ramp — this trainer's identity */
  --a0:#2A2540; --a1:#4A4290; --a2:#7F77DD; --a3:#B7B0F5;
  --a1b:#16142A; --a2b:#1B1836; --a3b:#221E44;
  --a1t:#9E97E0; --a2t:#B7B0F5; --a3t:#D8D4FF;
  --good:#7CCBA6; --bad:#F09E92;
  --serif:Cambria,Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 55% at 50% -10%, var(--a2) 0%, transparent 68%);
  opacity:.16}
.shell{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 20px 80px}

.home-link{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;
  margin:18px 0 0;font:500 12.5px/1 var(--sans);letter-spacing:.02em;color:var(--dim);
  text-decoration:none;border:1px solid var(--rule);padding:7px 12px;border-radius:999px;
  transition:color .15s,border-color .15s,background .15s}
.home-link:hover{color:var(--a3t);border-color:var(--a2);background:var(--a1b)}

header.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;padding:18px 0 16px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:11px}
.glyph{font-family:var(--serif);font-size:30px;color:var(--a2);line-height:1}
h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-top:3px}
.bar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--rule);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.chip b{color:var(--a3t);font-weight:600}

.grid{display:grid;grid-template-columns:262px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

.console{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:16px 18px;
  display:flex;flex-direction:column;gap:20px}
.sect h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;
  color:var(--faint);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sect h2 .all{font-size:10.5px;letter-spacing:.06em;text-transform:none;color:var(--dim);
  cursor:pointer;border-bottom:1px solid var(--rule)}
.sect h2 .all:hover{color:var(--a3t);border-color:var(--a2)}

.sw{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .box{width:15px;height:15px;border-radius:3px;border:1px solid var(--line);flex:none;
  position:relative;transition:background .15s,border-color .15s}
.sw input:checked+.box{background:var(--a2);border-color:var(--a2)}
.sw input:checked+.box::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid #0B0A14;border-width:0 2px 2px 0;transform:rotate(42deg)}
.sw .nm{flex:1;font-size:13px;color:var(--tx);min-width:0}
.sw input:not(:checked)~.nm{color:var(--faint)}
.sw .ct{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--rule);background:none;
  color:var(--dim);cursor:pointer;font:inherit;font-size:12.5px;transition:all .15s}
.seg:hover{color:var(--a2t);border-color:var(--a1)}
.seg.on{border-color:var(--a2);background:var(--a2b);color:var(--a3t)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;
  color:var(--dim)}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);
  padding:4px 0;cursor:pointer}
.toggle-row input{accent-color:var(--a2);width:14px;height:14px;flex:none;cursor:pointer}
.toggle-row:hover{color:var(--tx)}
.row input[type=number]{width:62px;background:var(--bg);border:1px solid var(--rule);color:var(--tx);
  border-radius:4px;padding:5px 7px;font:inherit;font-family:var(--mono);font-size:12px}
.btn{font:inherit;font-size:12.5px;padding:8px 13px;border-radius:6px;cursor:pointer;
  border:1px solid var(--rule);background:none;color:var(--dim);transition:all .15s}
.btn:hover:enabled{color:var(--tx);border-color:var(--a1);background:var(--a1b)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.solid{border-color:var(--a2);background:var(--a2b);color:var(--a3t)}
.btn.solid:hover:enabled{background:var(--a3b);border-color:var(--a3)}
.btn.wide{width:100%;justify-content:center}
.kbd{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint);
  margin-left:6px}

/* ── stage ───────────────────────────────────────────────── */
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{border:1px solid var(--rule);background:var(--panel);border-radius:6px;overflow:hidden}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;
  border-bottom:1px solid var(--rule2);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.tag{padding:3px 8px;border-radius:3px;font-weight:600;letter-spacing:.08em;
  background:var(--a2);color:#0B0A14}
.clock{margin-left:auto;font-family:var(--mono);font-size:18px;color:var(--dim2);letter-spacing:.02em}
.clock.warn{color:#E8B75C}.clock.crit{color:var(--bad)}
.qbody{padding:26px 22px 20px}
.q{font-family:var(--serif);font-size:20px;line-height:1.55;margin:0 0 20px}
.q sub,.q sup{font-size:.7em}

.answer{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:220px;font-family:var(--serif);font-size:16px;padding:10px 13px;
  border:1px solid var(--rule);background:var(--bg);color:var(--tx);border-radius:5px}
input[type=text]::placeholder{color:var(--faint);font-family:var(--sans);font-size:13.5px}
input[type=text]:focus{outline:none;border-color:var(--a2)}
.pal{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.pal button{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:4px;
  border:1px solid var(--rule2);background:var(--panel-hi);color:var(--dim);cursor:pointer}
.pal button:hover{color:var(--a3t);border-color:var(--a1)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--panel-hi);border:1px solid var(--rule);
  color:var(--tx);padding:11px 14px;border-radius:5px;cursor:pointer;font-size:15px;
  font-family:var(--serif)}
.opt:hover:enabled{border-color:var(--a2)}
.opt.correct{border-color:var(--good);background:rgba(124,203,166,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(240,158,146,.1)}

.verdict{font-family:var(--serif);font-size:15px;margin:14px 0 0;padding-left:12px;
  border-left:3px solid transparent}
.verdict.ok{border-color:var(--good);color:var(--good)}
.verdict.no{border-color:var(--bad);color:var(--bad)}
.verdict.note{border-color:var(--rule);color:var(--dim)}
.hintbox,.expl{margin-top:14px;padding:12px 15px;border-radius:0 5px 5px 0;font-size:13.5px;
  line-height:1.6;background:var(--panel-hi);border-left:3px solid var(--a1)}
.expl{border-left-color:var(--a2)}
.hintbox b,.expl b{color:var(--a3t);font-weight:600}
.pfoot{display:flex;gap:8px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid var(--rule2);
  background:var(--panel-hi)}
.pfoot .spacer{flex:1}

.stats{display:flex;flex-wrap:wrap;gap:18px 26px;padding:15px 18px}
.stat{min-width:68px}
.stat .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.stat .v{font-family:var(--serif);font-size:23px;color:var(--tx)}
.stat .v.acc{color:var(--a3t)}
.chead{padding:13px 20px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}
.meters{display:flex;flex-direction:column;gap:10px}
#catSect:has(.empty-note){display:none}
.meter .mtop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:8px}
.meter .mtop .nm{color:var(--dim)}
.meter .mtop .val{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.track{height:4px;background:var(--rule2);border-radius:9px;overflow:hidden}
.fill{height:100%;border-radius:9px;background:var(--a2);transition:width .35s ease}
.empty-note{font-size:12.5px;color:var(--faint);line-height:1.55}
.examnote{font-size:12px;color:var(--a2t);margin:10px 0 0}
@media (max-width:520px){.qbody{padding:20px 16px 16px}.q{font-size:17px}}
</style>
</head>
<body>
<div class="shell">

<a class="home-link" href="../index.html">&#8592; all trainers</a>

<header class="bar">
  <div class="brand">
    <div class="glyph">lim</div>
    <div>
      <h1>Limits</h1>
      <div class="sub">evaluate &middot; classify &middot; justify</div>
    </div>
  </div>
  <div class="bar-right">
    <div class="chip">streak <b id="chipStreak">0</b></div>
    <div class="chip">pool <b id="chipPool">0</b></div>
  </div>
</header>

<div class="grid">
  <aside class="console">
    <div class="sect">
      <h2>Categories <span class="all" id="allNone">all</span></h2>
      <div id="cats"></div>
    </div>
    <div class="sect">
      <h2>Clock</h2>
      <div class="segs" id="clockSegs">
        <button class="seg" data-clock="off">Off</button>
        <button class="seg on" data-clock="up">Stopwatch</button>
        <button class="seg" data-clock="down">Countdown</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span>Seconds per problem</span>
        <input type="number" id="limitSecs" min="10" max="600" step="5" value="60">
      </div>
      <label class="sw" style="margin-top:6px">
        <input type="checkbox" id="autoReveal" checked><span class="box"></span>
        <span class="nm">Reveal when time runs out</span>
      </label>
    </div>
    <div class="sect">
      <h2>Mode</h2>
      <label class="toggle-row"><input type="checkbox" id="examBtn"> Exam mode</label>
      <p class="examnote" id="examNote" hidden>Hints and solutions are locked until you check.</p>
    </div>
    <div class="sect">
      <h2>Records</h2>
      <button class="btn wide" id="resetBtn">Reset all progress</button>
    </div>
    <div class="sect" id="catSect">
      <h2>By category</h2>
      <div class="meters" id="meters"></div>
    </div>
  </aside>

  <main class="stage">
    <div class="card">
      <div class="pmeta">
        <span class="tag" id="mTag">—</span>
        <span id="mTech"></span>
        <span class="clock" id="mClock">00:00</span>
      </div>
      <div class="qbody">
        <div class="q" id="q"></div>
        <div id="answerZone"></div>
        <div class="verdict" id="verdict" hidden></div>
        <div class="hintbox" id="hintbox" hidden></div>
        <div class="expl" id="expl" hidden></div>
      </div>
      <div class="pfoot">
        <button class="btn" id="hintBtn">Hint <span class="kbd">H</span></button>
        <button class="btn solid" id="solveBtn">Show solution <span class="kbd">SPACE</span></button>
        <span class="spacer"></span>
        <button class="btn" id="skipBtn">Skip <span class="kbd">S</span></button>
        <button class="btn" id="nextBtn" hidden>Next &rarr;</button>
      </div>
    </div>

    <div class="card">
      <div class="chead">This session</div>
      <div class="stats">
        <div class="stat"><span class="k">Attempted</span><span class="v" id="sAtt">0</span></div>
        <div class="stat"><span class="k">Solved</span><span class="v" id="sSol">0</span></div>
        <div class="stat"><span class="k">Accuracy</span><span class="v acc" id="sAcc">—</span></div>
        <div class="stat"><span class="k">Streak</span><span class="v" id="sStreak">0</span></div>
        <div class="stat"><span class="k">Best streak</span><span class="v" id="sBest">0</span></div>
        <div class="stat"><span class="k">Median time</span><span class="v" id="sTime">—</span></div>
      </div>
    </div>


<scratch-pad accent="#7F77DD" height="330"></scratch-pad>
  </main>
</div>
</div>

<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[Math.floor(Math.random()*a.length)];
const NZ=(a,b)=>{let x=0;while(x===0)x=R(a,b);return x};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function frac(n,d){if(d===0)return n>0?"+∞":"−∞";if(n===0)return "0";const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?""+n:n+"/"+d}
function sg(n,t){if(n===0)return "";const s=n<0?" − ":" + ";const a=Math.abs(n);return s+(a===1&&t?"":a)+(t||"")}

/* ---------- GENERATORS ---------- */
const G={};

// 1. TWO-SIDED LIMITS
G.twosided=[
 ()=>{const a=NZ(-6,6),b=NZ(-6,6);if(a===b)return null;
  return{q:`lim<sub>x→${a}</sub> (x² ${sg(-(a+b),"x")} ${sg(a*b)}) / (x ${sg(-a,"")})`,
  a:""+(a-b),w:[""+(b-a),"0","DNE"],
  e:`Factor: (x−${a})(x−${b})/(x−${a}). Cancel (x−${a}) → x−${b}. Sub x=${a}: ${a}−${b} = ${a-b}.`,t:"Factor & cancel"}},
 ()=>{const a=R(1,9),s=a*a;
  return{q:`lim<sub>x→0</sub> (√(x + ${s}) − ${a}) / x`,a:frac(1,2*a),w:[frac(1,a),"0","DNE"],
  e:`Multiply by conjugate (√(x+${s})+${a}): numerator → (x+${s})−${s} = x. So x/(x(√(x+${s})+${a})) = 1/(√(x+${s})+${a}) → 1/${2*a}.`,t:"Rationalize"}},
 ()=>{const a=NZ(2,7);
  return{q:`lim<sub>x→${a}</sub> (1/x − 1/${a}) / (x − ${a})`,a:frac(-1,a*a),w:[frac(1,a*a),"0",frac(-1,a)],
  e:`Combine top: (${a}−x)/(${a}x). Divide by (x−${a}): −1/(${a}x). Sub x=${a} → −1/${a*a}.`,t:"Common denominator"}},
 ()=>{const a=R(2,6),n=R(2,4);
  const d=n*Math.pow(a,n-1);
  return{q:`lim<sub>h→0</sub> ((${a}+h)<sup>${n}</sup> − ${Math.pow(a,n)}) / h`,a:""+d,w:[""+Math.pow(a,n),"0",""+(n*a)],
  e:`This is the derivative of x^${n} at x=${a}. Expand or use ${n}x^${n-1} → ${n}·${a}^${n-1} = ${d}.`,t:"Expand / difference quotient"}},
 ()=>{const a=NZ(2,9),b=NZ(2,9);
  return{q:`lim<sub>x→0</sub> sin(${a}x) / (${b}x)`,a:frac(a,b),w:[frac(b,a),"1","0"],
  e:`Rewrite as (${a}/${b})·sin(${a}x)/(${a}x). Inner → 1, so limit = ${a}/${b}.`,t:"sinθ/θ"}},
 ()=>{const a=NZ(2,9),b=NZ(2,9);
  return{q:`lim<sub>x→0</sub> sin(${a}x) / sin(${b}x)`,a:frac(a,b),w:[frac(b,a),"0","1"],
  e:`Split: [sin(${a}x)/(${a}x)]·[(${b}x)/sin(${b}x)]·(${a}/${b}) → 1·1·${a}/${b}.`,t:"sinθ/θ paired"}},
 ()=>{const a=NZ(2,7);
  return{q:`lim<sub>x→0</sub> (1 − cos(${a}x)) / x²`,a:frac(a*a,2),w:[""+a,"0",frac(a,2)],
  e:`Use (1−cos u)/u² → 1/2 with u=${a}x. Multiply and divide by ${a}²: ${a}²·(1/2) = ${frac(a*a,2)}.`,t:"1−cos"}},
 ()=>{const a=NZ(2,8);
  return{q:`lim<sub>x→0</sub> tan(${a}x) / x`,a:""+a,w:["1","0",frac(1,a)],
  e:`tan(${a}x)/(${a}x) → 1, so tan(${a}x)/x = ${a}·[tan(${a}x)/(${a}x)] → ${a}.`,t:"tan"}},
 ()=>{const a=NZ(2,8);
  return{q:`lim<sub>x→0</sub> (e<sup>${a}x</sup> − 1) / x`,a:""+a,w:["1","0",frac(1,a)],
  e:`(e^u−1)/u → 1 with u=${a}x. Scale by ${a} → ${a}.`,t:"Exponential"}},
 ()=>{const a=R(2,8),b=R(2,8),c=a*b;
  return{q:`lim<sub>x→${a}</sub> (x² ${sg(-a-b,"x")} ${sg(c)}) / (x² ${sg(-2*a,"x")} ${sg(a*a)})`,a:"DNE (±∞)",w:[""+(a-b),"0","1"],
  e:`Top: (x−${a})(x−${b}). Bottom: (x−${a})². Cancel once → (x−${b})/(x−${a}). Denominator → 0, numerator → ${a-b} ≠ 0, so it blows up. One-sided signs differ → DNE.`,t:"Partial cancel"}},
 ()=>{const a=NZ(2,9),b=R(1,9);
  return{q:`lim<sub>x→${a}</sub> (x³ ${sg(-a*a*a)}) / (x ${sg(-a)})`,a:""+(3*a*a),w:[""+(a*a),""+(a*a*a),"0"],
  e:`x³−${a*a*a} = (x−${a})(x²+${a}x+${a*a}). Cancel → x²+${a}x+${a*a} at x=${a}: 3·${a}² = ${3*a*a}.`,t:"Difference of cubes"}},
 ()=>{const a=R(2,9);
  return{q:`lim<sub>x→0</sub> x² · sin(1/x)`,a:"0",w:["1","DNE","∞"],
  e:`Bounded × →0. −x² ≤ x²sin(1/x) ≤ x², both bounds → 0. Squeeze gives 0.`,t:"Squeeze"}},
 ()=>{const a=NZ(1,8),b=NZ(1,8);
  return{q:`lim<sub>x→0</sub> (√(${a}x + 1) − 1) / (${b}x)`,a:frac(a,2*b),w:[frac(b,2*a),"0",frac(a,b)],
  e:`Conjugate: numerator → ${a}x. Get ${a}x/(${b}x(√(${a}x+1)+1)) = ${a}/(${b}·2) = ${frac(a,2*b)}.`,t:"Rationalize"}},
];

// 2. ONE-SIDED
G.onesided=[
 ()=>{const a=NZ(-6,6),s=P([-1,1]);
  return{q:`lim<sub>x→${a}<sup>${s>0?"+":"−"}</sup></sub> 1 / (x ${sg(-a,"")})`,a:s>0?"+∞":"−∞",w:[s>0?"−∞":"+∞","0","1"],
  e:`As x→${a}${s>0?"⁺":"⁻"}, (x−${a}) is a small ${s>0?"positive":"negative"} number, so the reciprocal → ${s>0?"+∞":"−∞"}.`,t:"Vertical asymptote sign"}},
 ()=>{const a=NZ(-6,6),k=NZ(-9,9),s=P([-1,1]);
  const ans=(k*s>0)?"+∞":"−∞";
  return{q:`lim<sub>x→${a}<sup>${s>0?"+":"−"}</sup></sub> ${k} / (x ${sg(-a,"")})`,a:ans,w:[ans==="+∞"?"−∞":"+∞","0",""+k],
  e:`Denominator is small ${s>0?"positive":"negative"}; numerator ${k} is ${k>0?"positive":"negative"}. Quotient sign: ${ans}.`,t:"Signed asymptote"}},
 ()=>{const a=NZ(-6,6),s=P([-1,1]);
  return{q:`lim<sub>x→${a}<sup>${s>0?"+":"−"}</sup></sub> |x ${sg(-a,"")}| / (x ${sg(-a,"")})`,a:s>0?"1":"−1",w:[s>0?"−1":"1","0","DNE"],
  e:`For x ${s>0?">":"<"} ${a}, |x−${a}| = ${s>0?"(x−"+a+")":"−(x−"+a+")"}. Ratio = ${s>0?1:-1} constantly.`,t:"Absolute value"}},
 ()=>{const a=NZ(-5,5),m=NZ(2,6),b=NZ(-8,8),c=NZ(-8,8),s=P([-1,1]);
  const L=m*a+b, Rv=a*a+c;
  return{q:`f(x) = ${m}x ${sg(b)} if x < ${a};  x² ${sg(c)} if x ≥ ${a}. Find lim<sub>x→${a}<sup>${s>0?"+":"−"}</sup></sub> f(x)`,
  a:""+(s>0?Rv:L),w:[""+(s>0?L:Rv),"DNE","0"],
  e:`x→${a}${s>0?"⁺":"⁻"} uses the ${s>0?"second (x²"+sg(c)+")":"first ("+m+"x"+sg(b)+")"} branch. Sub x=${a} → ${s>0?Rv:L}.`,t:"Piecewise branch"}},
 ()=>{const a=NZ(-5,5);
  return{q:`lim<sub>x→${a}<sup>−</sup></sub> 1 / (x ${sg(-a,"")})²`,a:"+∞",w:["−∞","0","DNE"],
  e:`The square makes the denominator positive from BOTH sides. Small positive → +∞ regardless of side.`,t:"Even power denominator"}},
 ()=>{const a=R(2,9);
  return{q:`lim<sub>x→${a}<sup>+</sup></sub> √(x − ${a})`,a:"0",w:["DNE","+∞",""+a],
  e:`Domain requires x ≥ ${a}, so only the right-hand limit exists. √(small positive) → 0.`,t:"Domain edge"}},
 ()=>{const n=R(2,9),s=P([-1,1]);
  return{q:`lim<sub>x→${n}<sup>${s>0?"+":"−"}</sup></sub> ⌊x⌋`,a:""+(s>0?n:n-1),w:[""+(s>0?n-1:n),"DNE",""+(n+1)],
  e:`Just ${s>0?"above":"below"} ${n}, ⌊x⌋ = ${s>0?n:n-1}. Floor jumps at integers.`,t:"Floor function"}},
 ()=>{const a=NZ(-5,5),b=NZ(-5,5);if(a===b)return null;const s=P([-1,1]);
  const sign=(s>0?1:-1)*Math.sign(a-b);
  return{q:`lim<sub>x→${a}<sup>${s>0?"+":"−"}</sup></sub> (x ${sg(-b,"")}) / (x ${sg(-a,"")})`,
  a:sign>0?"+∞":"−∞",w:[sign>0?"−∞":"+∞","0","1"],
  e:`Numerator → ${a-b} (${a-b>0?"positive":"negative"}). Denominator → 0 from the ${s>0?"positive":"negative"} side. Result: ${sign>0?"+∞":"−∞"}.`,t:"Sign analysis"}},
 ()=>{const a=NZ(-6,6),m=NZ(2,7),b=NZ(-9,9);
  const L=m*a+b,Rv=b-m*a;
  return{q:`f(x) = ${m}x ${sg(b)} if x ≤ ${a}; ${-m}x ${sg(b)} if x > ${a}. Does lim<sub>x→${a}</sub> f(x) exist?`,
  a:L===Rv?"Yes":"No — jump discontinuity",w:[L===Rv?"No — jump discontinuity":"Yes","Only from the left","Limit is 0"],
  e:`Left: ${L}. Right: ${Rv}. ${L===Rv?"Equal, so the limit exists.":"Unequal → jump, limit DNE."}`,t:"Existence test"}},
 ()=>{const a=R(1,6);
  return{q:`lim<sub>x→0<sup>+</sup></sub> ln(${a}x)`,a:"−∞",w:["+∞","0",""+a],
  e:`As x→0⁺, ${a}x → 0⁺, and ln of a small positive number → −∞.`,t:"Log at edge"}},
 ()=>{const s=P([-1,1]);
  return{q:`lim<sub>x→0<sup>${s>0?"+":"−"}</sup></sub> e<sup>1/x</sup>`,a:s>0?"+∞":"0",w:[s>0?"0":"+∞","1","DNE"],
  e:`1/x → ${s>0?"+∞":"−∞"}, so e^(1/x) → ${s>0?"+∞":"0"}.`,t:"Exponential composite"}},
];

// 3. CONTINUITY
G.continuity=[
 ()=>{const a=NZ(-6,6),b=NZ(-6,6);if(a===b)return null;
  return{q:`Classify the discontinuity of f(x) = (x ${sg(-a,"")})(x ${sg(-b,"")}) / (x ${sg(-a,"")}) at x = ${a}`,
  a:"Removable",w:["Jump","Infinite","Continuous there"],
  e:`The (x−${a}) cancels, so the limit exists (= ${a-b}) but f(${a}) is undefined. That's a hole → removable.`,t:"Classification"}},
 ()=>{const a=NZ(-6,6);
  return{q:`Classify the discontinuity of f(x) = 1 / (x ${sg(-a,"")}) at x = ${a}`,
  a:"Infinite",w:["Removable","Jump","Oscillatory"],
  e:`Denominator → 0 with a nonzero numerator, so f → ±∞. Vertical asymptote → infinite discontinuity.`,t:"Classification"}},
 ()=>{const a=NZ(-5,5),m=NZ(2,6),b=NZ(-9,9);
  const k=m*a+b-a*a;
  return{q:`f(x) = ${m}x ${sg(b)} for x < ${a}; x² + c for x ≥ ${a}. Find c making f continuous.`,
  a:""+k,w:[""+(-k),"0",""+(k+a)],
  e:`Left limit: ${m}(${a})${sg(b)} = ${m*a+b}. Right: ${a}² + c = ${a*a} + c. Set equal: c = ${m*a+b} − ${a*a} = ${k}.`,t:"Solve for constant"}},
 ()=>{const a=NZ(-5,5),m=NZ(2,7);
  const k=m*a;
  return{q:`f(x) = (x² ${sg(-a*a)})/(x ${sg(-a,"")}) for x ≠ ${a}; k for x = ${a}. Find k making f continuous.`,
  a:""+(2*a),w:[""+a,"0",""+(a*a)],
  e:`Simplify to x+${a} for x≠${a}. Limit = ${2*a}. Continuity requires k = ${2*a}.`,t:"Fill the hole"}},
 ()=>{const a=NZ(-6,6),b=NZ(1,8);
  return{q:`Where is f(x) = (x ${sg(b,"")}) / (x² ${sg(-a*a)}) discontinuous?`,
  a:`x = ${a} and x = ${-a}`,w:[`x = ${-b} only`,`x = ${a} only`,"Nowhere"],
  e:`Denominator x²−${a*a} = (x−${a})(x+${a}) = 0 at x = ±${Math.abs(a)}. Rational functions are continuous except where the denominator vanishes.`,t:"Domain"}},
 ()=>{const a=NZ(-4,4),m=NZ(2,6),b=NZ(-8,8);
  const L=m*a+b,Rv=a*a+b;
  const same=L===Rv;
  return{q:`f(x) = ${m}x ${sg(b)} for x < ${a}; x² ${sg(b)} for x ≥ ${a}. Is f continuous at x = ${a}?`,
  a:same?"Yes":"No — jump discontinuity",w:[same?"No — jump discontinuity":"Yes","No — removable","No — infinite"],
  e:`Left: ${L}. Right: ${Rv}. ${same?"They match and equal f("+a+"), so continuous.":"Both one-sided limits exist but differ ("+L+" vs "+Rv+") → jump."}`,t:"3-condition check"}},
 ()=>{const c=[1,-R(1,5),-R(1,9)];const f=x=>x**3+c[1]*x+c[2];
  let lo=-4,hi=4;
  return{q:`Using the IVT, f(x) = x³ ${sg(c[1],"x")} ${sg(c[2])} has a root on [0, 4] because…`,
  a:"f is continuous and f(0), f(4) have opposite signs",
  w:["f is differentiable everywhere","f is increasing","the degree is odd"],
  e:`IVT needs: continuity on the closed interval, plus a sign change. f(0) = ${f(0)}, f(4) = ${f(4)}. Opposite signs ⇒ some c in (0,4) with f(c)=0.`,t:"IVT"}},
 ()=>({q:`Which is NOT required for f to be continuous at x = a?`,
  a:"f must be differentiable at a",w:["f(a) must be defined","lim<sub>x→a</sub> f(x) must exist","the limit must equal f(a)"],
  e:`Differentiability implies continuity, not the reverse. |x| at 0 is continuous but not differentiable.`,t:"Definition"}),
 ()=>({q:`f(x) = sin(1/x) for x ≠ 0, f(0) = 0. What kind of discontinuity is at x = 0?`,
  a:"Oscillatory (limit DNE)",w:["Removable","Jump","None — it's continuous"],
  e:`sin(1/x) oscillates infinitely fast near 0; no limit exists, and it isn't ±∞ or a two-sided jump. Note x·sin(1/x) WOULD be removable.`,t:"Oscillatory"}),
 ()=>{const a=NZ(2,6);
  return{q:`On what interval is f(x) = √(x ${sg(-a,"")}) continuous?`,a:`[${a}, ∞)`,w:[`(${a}, ∞)`,`(−∞, ${a}]`,"All reals"],
  e:`Domain is x ≥ ${a}. At the endpoint only right-continuity is needed, so the interval is closed on the left: [${a}, ∞).`,t:"Interval continuity"}},
];

// 4. LIMITS AT INFINITY
G.infinity=[
 ()=>{const a=NZ(2,9),b=NZ(2,9),n=R(1,3);
  return{q:`lim<sub>x→∞</sub> (${a}x<sup>${n}</sup> ${sg(R(-9,9),"x")} ${sg(R(-9,9))}) / (${b}x<sup>${n}</sup> ${sg(R(-9,9))})`,
  a:frac(a,b),w:[frac(b,a),"0","∞"],
  e:`Equal degrees → ratio of leading coefficients = ${a}/${b} = ${frac(a,b)}.`,t:"Equal degree"}},
 ()=>{const a=NZ(2,9),b=NZ(2,9),n=R(1,2);
  return{q:`lim<sub>x→∞</sub> (${a}x<sup>${n}</sup> ${sg(NZ(-9,9))}) / (${b}x<sup>${n+R(1,2)}</sup> ${sg(NZ(-9,9),"x")})`,
  a:"0",w:[frac(a,b),"∞","DNE"],
  e:`Denominator degree is higher, so the quotient → 0. Divide top and bottom by the highest denominator power to confirm.`,t:"Bottom-heavy"}},
 ()=>{const a=NZ(2,9),b=NZ(2,9),d=R(1,2);
  const ans=a>0?"+∞":"−∞";
  return{q:`lim<sub>x→∞</sub> (${a}x<sup>${d+2}</sup> ${sg(NZ(-9,9),"x")}) / (${b}x<sup>${d}</sup> ${sg(NZ(-9,9))})`,
  a:b>0?ans:(ans==="+∞"?"−∞":"+∞"),w:[frac(a,b),"0","DNE"],
  e:`Top degree exceeds bottom → grows without bound. Leading behavior ~ (${a}/${b})x², sign of ${a}/${b} is ${a/b>0?"positive":"negative"}.`,t:"Top-heavy"}},
 ()=>{const a=R(2,9),b=NZ(1,9),s=P([1,-1]);
  const v=Math.sqrt(a)===Math.floor(Math.sqrt(a))?Math.sqrt(a):null;
  const A=a*a;
  return{q:`lim<sub>x→${s>0?"∞":"−∞"}</sub> √(${A}x² + ${b}) / x`,
  a:s>0?""+a:""+(-a),w:[s>0?""+(-a):""+a,"0",""+A],
  e:`√(${A}x²+${b}) ≈ ${a}|x|. For x→${s>0?"+∞, |x| = x":"−∞, |x| = −x"}, the ratio → ${s>0?a:-a}. This sign trap is the #1 error here.`,t:"Radical sign trap"}},
 ()=>{const b=NZ(1,9);
  return{q:`lim<sub>x→∞</sub> (√(x² + ${b}x) − x)`,a:frac(b,2),w:["0","∞",""+b],
  e:`Rationalize: (x²+${b}x−x²)/(√(x²+${b}x)+x) = ${b}x/(√(x²+${b}x)+x). Divide by x → ${b}/(1+1) = ${frac(b,2)}.`,t:"Difference of radicals"}},
 ()=>({q:`lim<sub>x→∞</sub> sin(x) / x`,a:"0",w:["1","DNE","∞"],
  e:`|sin x| ≤ 1, so −1/x ≤ sin(x)/x ≤ 1/x. Both bounds → 0. Squeeze gives 0.`,t:"Squeeze at ∞"}),
 ()=>({q:`lim<sub>x→∞</sub> sin(x)`,a:"DNE",w:["0","1","∞"],
  e:`sin x oscillates between −1 and 1 forever without settling. No limit.`,t:"Oscillation"}),
 ()=>{const a=R(2,8);
  return{q:`lim<sub>x→−∞</sub> e<sup>${a}x</sup>`,a:"0",w:["+∞","1","−∞"],
  e:`${a}x → −∞, and e^(−∞) → 0.`,t:"Exponential"}},
 ()=>{const n=R(2,6);
  return{q:`lim<sub>x→∞</sub> x<sup>${n}</sup> / e<sup>x</sup>`,a:"0",w:["∞","1",""+n],
  e:`Exponentials beat any polynomial. Hierarchy: ln x ≪ x^p ≪ e^x. So this → 0.`,t:"Growth hierarchy"}},
 ()=>{const n=R(2,5);
  return{q:`lim<sub>x→∞</sub> ln(x) / x<sup>${n}</sup>`,a:"0",w:["∞","1",frac(1,n)],
  e:`Logs grow slower than any positive power of x → 0.`,t:"Growth hierarchy"}},
 ()=>{const a=NZ(2,9),b=NZ(2,9);
  return{q:`Horizontal asymptote(s) of f(x) = ${a}x / √(${b*b}x² + 1)`,
  a:`y = ${frac(a,b)} and y = ${frac(-a,b)}`,w:[`y = ${frac(a,b)} only`,`y = 0`,"None"],
  e:`As x→+∞: ${a}x/(${b}x) = ${frac(a,b)}. As x→−∞: √ gives ${b}|x| = −${b}x, so → ${frac(-a,b)}. Two different HAs.`,t:"Two asymptotes"}},
 ()=>{const a=R(1,9);
  return{q:`lim<sub>x→∞</sub> (1 + ${a}/x)<sup>x</sup>`,a:`e<sup>${a}</sup>`,w:["1","e","∞"],
  e:`Standard form (1 + a/x)^x → e^a. Here a = ${a}.`,t:"e-limit"}},
 ()=>({q:`lim<sub>x→∞</sub> arctan(x)`,a:"π/2",w:["π","0","∞"],
  e:`arctan has horizontal asymptotes at ±π/2. Going to +∞ gives π/2.`,t:"Bounded inverse trig"}),
];

// 5. SQUEEZE
G.squeeze=[
 ()=>{const n=R(2,4);
  return{q:`lim<sub>x→0</sub> x<sup>${n}</sup> · cos(1/x)`,a:"0",w:["1","DNE","∞"],
  e:`−1 ≤ cos(1/x) ≤ 1. Multiply by x^${n} (using ±|x^${n}| to be safe): −|x^${n}| ≤ f ≤ |x^${n}|. Both → 0. Squeeze gives 0.`,t:"Bounded × →0"}},
 ()=>{const a=R(2,9);
  return{q:`lim<sub>x→0</sub> x · sin(${a}/x)`,a:"0",w:[""+a,"DNE","1"],
  e:`|sin(${a}/x)| ≤ 1 so −|x| ≤ x·sin(${a}/x) ≤ |x|. Both bounds → 0.`,t:"Bounded × →0"}},
 ()=>{const a=R(2,9);
  return{q:`lim<sub>x→∞</sub> cos(${a}x) / x`,a:"0",w:["DNE","1",""+a],
  e:`−1/x ≤ cos(${a}x)/x ≤ 1/x for x>0. Both → 0.`,t:"Bounded / →∞"}},
 ()=>({q:`If 3 − x² ≤ f(x) ≤ 3 + x² for all x, find lim<sub>x→0</sub> f(x)`,a:"3",w:["0","DNE","6"],
  e:`Both bounds → 3 as x→0. Squeeze forces f → 3.`,t:"Given bounds"}),
 ()=>{const L=R(2,9),a=NZ(-4,4);
  return{q:`If ${L} ${sg(-1,"")}(x ${sg(-a,"")})² ≤ f(x) ≤ ${L} + (x ${sg(-a,"")})², find lim<sub>x→${a}</sub> f(x)`,
  a:""+L,w:["0","DNE",""+(L+1)],
  e:`At x=${a} both bounds equal ${L}. Squeeze gives ${L}.`,t:"Given bounds"}},
 ()=>({q:`Why does the squeeze theorem FAIL for lim<sub>x→0</sub> sin(1/x)?`,
  a:"There's no shrinking factor — the bounds stay −1 and 1",
  w:["sin isn't continuous","The function is undefined at 0","1/x → ∞"],
  e:`Squeeze needs both bounds to converge to the SAME value. Here −1 ≤ sin(1/x) ≤ 1 with no x-factor to collapse them. Limit genuinely DNE.`,t:"When it fails"}),
 ()=>({q:`lim<sub>x→0</sub> x² · tan(1/x) — can the squeeze theorem be used directly?`,
  a:"No — tan is unbounded",w:["Yes, limit is 0","Yes, limit is 1","Yes, limit is ∞"],
  e:`Squeeze requires a BOUNDED factor. tan(1/x) has vertical asymptotes accumulating near 0, so it isn't bounded on any neighborhood of 0. The standard trick doesn't apply.`,t:"Bounded requirement"}),
 ()=>{const a=R(2,9);
  return{q:`lim<sub>x→∞</sub> (${a} + sin x) / x`,a:"0",w:[""+a,"DNE","1"],
  e:`Numerator is trapped in [${a-1}, ${a+1}]. So ${a-1}/x ≤ f ≤ ${a+1}/x, both → 0.`,t:"Shifted bounded"}},
 ()=>({q:`lim<sub>n→∞</sub> sin(n!) / n`,a:"0",w:["DNE","1","∞"],
  e:`No matter how wild sin(n!) is, it lives in [−1,1]. Divide by n → 0 by squeeze.`,t:"Wild bounded"}),
 ()=>{const a=R(2,5);
  return{q:`lim<sub>x→0</sub> √(x) · sin(${a}/x), for x > 0`,a:"0",w:["DNE",""+a,"∞"],
  e:`0 ≤ |√x·sin(${a}/x)| ≤ √x → 0. Squeeze on the absolute value forces the limit to 0.`,t:"Root × bounded"}},
];

// 6. INDETERMINATE FORMS / L'HOPITAL  — the central Calc 1 technique
G.lhopital=[
 ()=>{const a=NZ(2,6);
  return{q:`lim<sub>x→0</sub> (e<sup>${a}x</sup> − 1 − ${a}x) / x²`,a:frac(a*a,2),w:[""+a,"0",frac(a,2)],
  e:`0/0 twice. Or expand: e^(${a}x) = 1 + ${a}x + ${a*a}x²/2 + …, so the top is ${a*a}x²/2 and the limit is ${frac(a*a,2)}.`,t:"L'Hôpital · 0/0 twice"}},
 ()=>{const a=NZ(2,5);
  return{q:`lim<sub>x→0</sub> (sin(${a}x) − ${a}x) / x³`,a:frac(-a*a*a,6),w:[frac(a*a*a,6),"0",frac(-a,6)],
  e:`sin u = u − u³/6 + …, so sin(${a}x) − ${a}x = −${a*a*a}x³/6. Divide by x³ → ${frac(-a*a*a,6)}.`,t:"L'Hôpital · 0/0 thrice"}},
 ()=>{const a=NZ(2,5);
  return{q:`lim<sub>x→0</sub> (tan(${a}x) − ${a}x) / x³`,a:frac(a*a*a,3),w:[frac(-a*a*a,3),"0",frac(a,3)],
  e:`tan u = u + u³/3 + …, so tan(${a}x) − ${a}x = ${a*a*a}x³/3. Divide by x³ → ${frac(a*a*a,3)}.`,t:"L'Hôpital · tangent series"}},
 ()=>{const a=R(2,4);
  return{q:`lim<sub>x→∞</sub> (ln x) / x<sup>${a}</sup>`,a:"0",w:["+∞",""+a,"1"],
  e:`∞/∞. One L'Hôpital: (1/x)/(${a}x^${a-1}) = 1/(${a}x^${a}) → 0. Powers beat logs.`,t:"L'Hôpital · ∞/∞ growth"}},
 ()=>{const n=R(2,5);
  return{q:`lim<sub>x→∞</sub> x<sup>${n}</sup> / e<sup>x</sup>`,a:"0",w:["+∞","1",""+n],
  e:`∞/∞. Apply L'Hôpital ${n} times; the top becomes ${n}! and the bottom stays e^x → 0. Exponentials beat powers.`,t:"L'Hôpital · repeated"}},
 ()=>{const a=R(1,3);
  return{q:`lim<sub>x→0<sup>+</sup></sub> x<sup>${a}</sup> · ln x`,a:"0",w:["−∞","+∞",""+(-a)],
  e:`0·(−∞). Rewrite as (ln x)/x^(−${a}), now −∞/∞. L'Hôpital: (1/x)/(−${a}x^(−${a+1})) = −x^${a}/${a} → 0.`,t:"L'Hôpital · 0·∞"}},
 ()=>{const a=NZ(2,6);
  return{q:`lim<sub>x→∞</sub> (1 + ${a}/x)<sup>x</sup>`,a:`e<sup>${a}</sup>`,w:["1","+∞",`e<sup>${-a}</sup>`],
  e:`1^∞. Take logs: x·ln(1 + ${a}/x) → ${a} (expand ln(1+u) ≈ u with u = ${a}/x). So the limit is e^${a}.`,t:"L'Hôpital · 1^∞"}},
 ()=>{const a=NZ(2,6);
  return{q:`lim<sub>x→∞</sub> x(e<sup>${a}/x</sup> − 1)`,a:""+a,w:["0","+∞",frac(1,a)],
  e:`∞·0. Put u = ${a}/x: the expression is ${a}·(e^u − 1)/u → ${a}·1 = ${a}.`,t:"L'Hôpital · ∞·0"}},
 ()=>{
  return{q:`lim<sub>x→0</sub> (1/x − 1/sin x)`,a:"0",w:["+∞","−∞","1"],
  e:`∞−∞. Combine: (sin x − x)/(x sin x). Top ≈ −x³/6, bottom ≈ x², so the quotient ≈ −x/6 → 0.`,t:"L'Hôpital · ∞−∞"}},
 ()=>{const a=NZ(2,7);
  return{q:`lim<sub>x→1</sub> (ln x) / (x<sup>${a}</sup> − 1)`,a:frac(1,a),w:[""+a,"0","1"],
  e:`0/0. L'Hôpital: (1/x)/(${a}x^${a-1}) → 1/${a} at x = 1.`,t:"L'Hôpital · log over power"}},
 ()=>{
  return{q:`lim<sub>x→0<sup>+</sup></sub> x<sup>x</sup>`,a:"1",w:["0","+∞","e"],
  e:`0^0. Take logs: x ln x → 0 (see the 0·∞ case), so the limit is e^0 = 1.`,t:"L'Hôpital · 0^0"}},
 ()=>{const a=NZ(2,6),b=NZ(2,6);
  return{q:`lim<sub>x→0</sub> (e<sup>${a}x</sup> − e<sup>${b}x</sup>) / x`,a:""+(a-b),w:[""+(b-a),"0",""+(a*b)],
  e:`0/0. L'Hôpital: (${a}e^(${a}x) − ${b}e^(${b}x))/1 → ${a} − ${b} = ${a-b}.`,t:"L'Hôpital · exponential pair"}},
];

const CATS=[["twosided","Two-sided limits"],["onesided","One-sided limits"],
            ["continuity","Continuity"],["infinity","Limits at infinity"],
            ["squeeze","Squeeze theorem"],
            ["lhopital","Indeterminate forms"]];
const $=s=>document.querySelector(s);
const KEY='limits:v1';

/* ── answer canonicalisation ──────────────────────────────────────
   Limit answers come in three shapes: a real number (possibly written
   as a fraction, or with pi / e / sqrt), a token (+∞, −∞, DNE), or a
   classification word (removable, jump, infinite). Anything that does
   NOT canonicalise is inherently a discrimination question and falls
   back to multiple choice — see kindOf(). */
const EULER=2.718281828459045, PI=3.141592653589793;

function plain(html){
  return String(html)
    .replace(/<sup>([^<]*)<\/sup>/g,'^($1)')
    .replace(/<sub>([^<]*)<\/sub>/g,'_$1')
    .replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ').trim();
}
function evalNum(str){
  let s=str.replace(/\s+/g,'').replace(/[−–—]/g,'-');
  s=s.replace(/√\(/g,'sqrt(').replace(/√(\d+(?:\.\d+)?)/g,'sqrt($1)');
  s=s.replace(/\bpi\b|π/g,'('+PI+')');
  s=s.replace(/(^|[^0-9a-z.])e(?![a-z0-9])/gi,'$1('+EULER+')');
  s=s.replace(/sqrt/g,'Math.sqrt').replace(/\bln\b/g,'Math.log');
  s=s.replace(/\^/g,'**');
  s=s.replace(/(\d|\))(\()/g,'$1*$2').replace(/(\))(\d)/g,'$1*$2');
  if(!/^[0-9+\-*/().MathsqrtloEe**]*$/.test(s.replace(/Math\.(sqrt|log)/g,''))) {
    if(!/^[0-9+\-*/().]*$/.test(s.replace(/Math\.(sqrt|log)/g,'f'))) return null;
  }
  try{
    const v=Function('"use strict";return ('+s+');')();
    return (typeof v==='number'&&isFinite(v))?v:null;
  }catch(e){return null}
}
function canon(raw){
  if(raw==null) return null;
  let s=plain(raw).toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-');
  if(!s) return null;
  if(/^(dne|doesnotexist|does'?ntexist|undefined)/.test(s)) return {t:'dne'};
  if(/^\+?(inf|infinity|infty|∞|oo)$/.test(s)) return {t:'inf',s:1};
  if(/^-(inf|infinity|infty|∞|oo)$/.test(s)) return {t:'inf',s:-1};
  if(/^(removable|jump|infinite|oscillat(ing|ory)?|essential|none)$/.test(s))
    return {t:'word',v:s.replace(/^oscillat(ing|ory)?$/,'oscillating')};
  const v=evalNum(s);
  return v===null?null:{t:'num',v};
}
function sameAnswer(a,b){
  if(!a||!b) return false;
  if(a.t!==b.t) return false;
  /* 1e-3 relative, matching Revolution: a user typing 7.389 for e^2 is right */
  if(a.t==='num') return Math.abs(a.v-b.v)<=1e-3*Math.max(1,Math.abs(b.v));
  if(a.t==='inf') return a.s===b.s;
  if(a.t==='word') return a.v===b.v;
  return true;  /* dne */
}
function kindOf(p){ return canon(p.a) ? 'typed' : 'choice'; }

/* ── state ───────────────────────────────────────────────────────── */
const S={
  cats:new Set(CATS.map(c=>c[0])),
  clock:'up', limit:60, autoReveal:true, exam:false,
  cur:null, phase:'ask', hinted:false, t0:0, tick:null,
  att:0, sol:0, streak:0, best:0, times:[],
  byCat:Object.fromEntries(CATS.map(([k])=>[k,{n:0,c:0}])),
};

function poolSize(){ let n=0; S.cats.forEach(k=>n+=G[k].length); return n; }

function gen(){
  const keys=[...S.cats]; if(!keys.length) return null;
  const key=P(keys);
  let p=null,guard=0;
  while(!p&&guard++<60) p=P(G[key])();
  if(!p) return null;
  p.cat=key; p.kind=kindOf(p);
  if(p.kind==='choice'){
    p.opts=[p.a,...p.w].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
    for(let i=p.opts.length-1;i>0;i--){const j=R(0,i);[p.opts[i],p.opts[j]]=[p.opts[j],p.opts[i]]}
  }
  return p;
}

/* ── rendering ───────────────────────────────────────────────────── */
function drawConsole(){
  $('#cats').innerHTML=CATS.map(([k,n])=>`
    <label class="sw"><input type="checkbox" data-cat="${k}" ${S.cats.has(k)?'checked':''}>
    <span class="box"></span><span class="nm">${n}</span><span class="ct">${G[k].length}</span></label>`).join('');
  $('#cats').querySelectorAll('input').forEach(i=>i.onchange=()=>{
    const k=i.dataset.cat;
    if(i.checked) S.cats.add(k); else S.cats.delete(k);
    if(!S.cats.size){ S.cats.add(k); i.checked=true; }
    $('#chipPool').textContent=poolSize(); persist(); next();
  });
  $('#chipPool').textContent=poolSize();
}

function drawQuestion(){
  const p=S.cur; if(!p) return;
  $('#mTag').textContent=CATS.find(c=>c[0]===p.cat)[1];
  $('#mTech').textContent=p.t||'';
  $('#q').innerHTML=p.q;
  $('#verdict').hidden=true; $('#hintbox').hidden=true; $('#expl').hidden=true;
  $('#nextBtn').hidden=true; $('#skipBtn').hidden=false;
  $('#hintBtn').disabled=S.exam; $('#solveBtn').disabled=S.exam;

  if(p.kind==='typed'){
    $('#answerZone').innerHTML=`
      <div class="answer">
        <input type="text" id="ansInput" autocomplete="off" spellcheck="false"
               placeholder="a number, a fraction, pi/2, e^2, infinity, or DNE">
        <button class="btn solid" id="checkBtn">Check</button>
      </div>
      <div class="pal" id="pal"></div>`;
    const pal=['pi','e','^','/','sqrt(','ln(','infinity','-infinity','DNE'];
    $('#pal').innerHTML=pal.map(t=>`<button data-ins="${t}">${t}</button>`).join('');
    $('#pal').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const i=$('#ansInput'); i.value+=b.dataset.ins; i.focus();
    });
    $('#checkBtn').onclick=submitTyped;
    $('#ansInput').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();submitTyped();} };
    $('#ansInput').focus();
  } else {
    $('#answerZone').innerHTML=`<div class="opts">`+
      p.opts.map(o=>`<button class="opt" data-v="${String(o).replace(/"/g,'&quot;')}">${o}</button>`).join('')+
      `</div>`;
    $('#answerZone').querySelectorAll('.opt').forEach(b=>b.onclick=()=>submitChoice(b.dataset.v,b));
  }
}

function drawStats(){
  const pct=S.att?Math.round(100*S.sol/S.att)+'%':'—';
  $('#sAtt').textContent=S.att; $('#sSol').textContent=S.sol;
  $('#sAcc').textContent=pct; $('#sStreak').textContent=S.streak;
  $('#sBest').textContent=S.best; $('#chipStreak').textContent=S.streak;
  const t=[...S.times].sort((a,b)=>a-b);
  $('#sTime').textContent=t.length?Math.round(t[Math.floor(t.length/2)])+'s':'—';
  $('#meters').innerHTML = CATS.filter(([k])=>S.byCat[k].n).map(([k,n])=>{
    const c=S.byCat[k], p=c.n?Math.round(100*c.c/c.n):0;
    return `<div class="meter"><div class="mtop"><span class="nm">${n}</span>
      <span class="val">${p}% · ${c.n}</span></div>
      <div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
  }).join('') || `<p class="empty-note">Answer a few and your accuracy by category shows up here.</p>`;
}

/* ── grading ─────────────────────────────────────────────────────── */
function record(ok){
  S.att++; S.byCat[S.cur.cat].n++;
  S.times.push((Date.now()-S.t0)/1000);
  if(ok){ S.sol++; S.byCat[S.cur.cat].c++; S.streak++; if(S.streak>S.best)S.best=S.streak; }
  else S.streak=0;
  S.phase='done'; stopClock();
  $('#nextBtn').hidden=false; $('#skipBtn').hidden=true;
  $('#hintBtn').disabled=false; $('#solveBtn').disabled=false;
  drawStats(); persist();
}
function reveal(){
  $('#expl').hidden=false;
  $('#expl').innerHTML=`<b>${S.cur.t}</b> — ${S.cur.e}`;
}
function submitTyped(){
  if(S.phase!=='ask') return;
  const raw=$('#ansInput').value;
  const got=canon(raw), want=canon(S.cur.a);
  const v=$('#verdict'); v.hidden=false;
  if(!got){
    v.className='verdict note';
    v.innerHTML=`That didn't parse. Try a number, a fraction like <b>3/2</b>, <b>pi/2</b>, <b>e^2</b>, <b>infinity</b>, or <b>DNE</b>.`;
    return;
  }
  const ok=sameAnswer(got,want);
  $('#ansInput').disabled=true; $('#checkBtn').disabled=true;
  v.className='verdict '+(ok?'ok':'no');
  v.innerHTML=ok?`Correct — ${plain(S.cur.a)}.`:`Not quite. The limit is ${plain(S.cur.a)}.`;
  record(ok); reveal();
}
function submitChoice(val,el){
  if(S.phase!=='ask') return;
  const ok=val===S.cur.a;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===S.cur.a) b.classList.add('correct');
    else if(b===el) b.classList.add('wrong');
  });
  const v=$('#verdict'); v.hidden=false;
  v.className='verdict '+(ok?'ok':'no');
  v.innerHTML=ok?'Correct.':'Not quite.';
  record(ok); reveal();
}

/* ── clock ───────────────────────────────────────────────────────── */
function stopClock(){ if(S.tick){clearInterval(S.tick);S.tick=null;} }
function startClock(){
  stopClock(); S.t0=Date.now();
  const el=$('#mClock');
  if(S.clock==='off'){ el.textContent='—'; el.className='clock'; return; }
  const paint=()=>{
    const sec=(Date.now()-S.t0)/1000;
    const shown=S.clock==='down'?Math.max(0,S.limit-sec):sec;
    const m=Math.floor(shown/60), s=Math.floor(shown%60);
    el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    el.className='clock'+(S.clock==='down'&&shown<=5?' crit':S.clock==='down'&&shown<=15?' warn':'');
    if(S.clock==='down'&&shown<=0){
      stopClock();
      if(S.autoReveal&&S.phase==='ask'){
        const v=$('#verdict'); v.hidden=false; v.className='verdict no';
        v.innerHTML=`Time. The limit is ${plain(S.cur.a)}.`;
        const inp=$('#ansInput'); if(inp){inp.disabled=true;$('#checkBtn').disabled=true;}
        document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        record(false); reveal();
      }
    }
  };
  paint(); S.tick=setInterval(paint,250);
}

/* ── flow ────────────────────────────────────────────────────────── */
function next(){
  const p=gen(); if(!p) return;
  S.cur=p; S.phase='ask'; S.hinted=false;
  drawQuestion(); startClock();
}
function skip(){ if(S.phase==='ask'){ S.streak=0; drawStats(); persist(); } next(); }

/* ── persistence (Tier 1) ────────────────────────────────────────── */
function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify({
    cats:[...S.cats], clock:S.clock, limit:S.limit, autoReveal:S.autoReveal, exam:S.exam,
    att:S.att, sol:S.sol, best:S.best, times:S.times.slice(-60), byCat:S.byCat
  })); }catch(e){}
}
function restore(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(!d) return;
    if(Array.isArray(d.cats)&&d.cats.length){
      S.cats=new Set(d.cats.filter(k=>G[k]));
      /* categories added since the save default to ON — otherwise new content
         stays silently hidden from anyone with existing progress */
      CATS.forEach(([k])=>{ if(!d.cats.includes(k)) S.cats.add(k); });
    }
    if(typeof d.clock==='string') S.clock=d.clock;
    if(typeof d.limit==='number') S.limit=d.limit;
    if(typeof d.autoReveal==='boolean') S.autoReveal=d.autoReveal;
    if(typeof d.exam==='boolean') S.exam=d.exam;
    S.att=d.att|0; S.sol=d.sol|0; S.best=d.best|0;
    if(Array.isArray(d.times)) S.times=d.times;
    if(d.byCat) CATS.forEach(([k])=>{ if(d.byCat[k]) S.byCat[k]=d.byCat[k]; });
  }catch(e){}
}

/* ── wiring ──────────────────────────────────────────────────────── */
$('#hintBtn').onclick=()=>{
  if(S.exam&&S.phase==='ask') return;
  $('#hintbox').hidden=false;
  $('#hintbox').innerHTML=`<b>Technique:</b> ${S.cur.t}. Work out which rule applies before evaluating.`;
  S.hinted=true;
};
$('#solveBtn').onclick=()=>{ if(S.exam&&S.phase==='ask') return; reveal(); };
$('#skipBtn').onclick=skip;
$('#nextBtn').onclick=next;
$('#allNone').onclick=()=>{
  const all=S.cats.size===CATS.length;
  S.cats=new Set(all?[CATS[0][0]]:CATS.map(c=>c[0]));
  drawConsole(); persist(); next();
};
$('#clockSegs').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{
  S.clock=b.dataset.clock;
  $('#clockSegs').querySelectorAll('.seg').forEach(x=>x.classList.toggle('on',x===b));
  persist(); startClock();
});
$('#limitSecs').onchange=e=>{ S.limit=Math.max(10,Math.min(600,+e.target.value||60)); persist(); };
$('#autoReveal').onchange=e=>{ S.autoReveal=e.target.checked; persist(); };
$('#examBtn').onchange=e=>{
  S.exam=e.target.checked;
  $('#examNote').hidden=!S.exam;
  $('#hintBtn').disabled=S.exam&&S.phase==='ask';
  $('#solveBtn').disabled=S.exam&&S.phase==='ask';
  persist();
};
$('#resetBtn').onclick=()=>{
  S.att=S.sol=S.streak=S.best=0; S.times=[];
  CATS.forEach(([k])=>S.byCat[k]={n:0,c:0});
  try{ localStorage.removeItem(KEY); }catch(e){}
  drawStats(); persist();
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') { if(e.key==='Escape') e.target.blur(); return; }
  const k=e.key.toLowerCase();
  if(k==='h'){ e.preventDefault(); $('#hintBtn').click(); }
  else if(k===' '){ e.preventDefault(); if(S.phase==='done') next(); else $('#solveBtn').click(); }
  else if(k==='s'){ e.preventDefault(); skip(); }
  else if(k==='enter'&&S.phase==='done'){ e.preventDefault(); next(); }
});

restore();
drawConsole();
$('#clockSegs').querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.clock===S.clock));
$('#limitSecs').value=S.limit;
$('#autoReveal').checked=S.autoReveal;
$('#examBtn').checked=S.exam;
$('#examNote').hidden=!S.exam;
drawStats();
next();
</script>
<script src="../shared/scratchpad.js" defer></script>
</body>
</html>
